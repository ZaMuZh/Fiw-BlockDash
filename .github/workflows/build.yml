name: Build Fiw BlockDash
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Inspect and extract source
        run: |
          ls -l FiwBlockDash-source.zip
          file FiwBlockDash-source.zip
          if ! unzip -t FiwBlockDash-source.zip; then
            echo "Intentando recuperar el ZIP..."
            zip -FF FiwBlockDash-source.zip --out FiwBlockDash-recovered.zip || true
            mv FiwBlockDash-recovered.zip FiwBlockDash-source.zip
          fi
          unzip -t FiwBlockDash-source.zip
          unzip -q FiwBlockDash-source.zip -d source
          find source -maxdepth 5 -type f
      - name: Diagnose source registration
        run: |
          echo '===== SOURCE FILES ====='
          find source -type f \( -name '*.java' -o -name 'fabric.mod.json' -o -name 'build.gradle' \) -print
          {
            while IFS= read -r f; do echo "===== $f ====="; cat "$f"; done < <(find source -type f \( -name '*.java' -o -name 'fabric.mod.json' -o -name 'build.gradle' \))
          } > source/diagnostics.txt
      - name: Make BlockDash commands visible to every player
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = list(Path('.').rglob('FiwBlockDash.java'))
          if len(candidates) != 1:
              raise SystemExit(f'Esperaba un FiwBlockDash.java y encontré: {candidates}')
          p = candidates[0]
          s = p.read_text()
          permission = '.requires(class_2168::method_43737)'
          count = s.count(permission)
          if count == 0:
              raise SystemExit('No se encontraron restricciones OP; no se modifica el archivo.')
          p.write_text(s.replace(permission, ''))
          print(f'Retiradas {count} restricciones OP; los subcomandos serán visibles para todos.')
          PY
      - name: Configure intermediary source mappings
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build.gradle')
          s = p.read_text()
          old = 'mappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"'
          if old not in s:
              raise SystemExit('No se encontró la configuración de mappings esperada')
          p.write_text(s.replace(old, 'mappings files("intermediary-identity.jar")'))
          import zipfile
          with zipfile.ZipFile('intermediary-identity.jar', 'w') as z:
              z.writestr('mappings/mappings.tiny', 'tiny\t2\t0\tintermediary\tnamed\n')
          print(p.read_text())
          PY
      - name: Build mod
        working-directory: source
        run: |
          set -o pipefail
          gradle clean build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fiw-BlockDash-build-diagnostics
          path: |
            source/build.log
            source/diagnostics.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Fiw-BlockDash-JAR
          path: source/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
