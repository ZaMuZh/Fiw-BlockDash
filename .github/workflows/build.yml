name: Build Fiw BlockDash
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - name: Extract source
        run: |
          ls -l FiwBlockDash-source.zip
          file FiwBlockDash-source.zip
          if ! unzip -t FiwBlockDash-source.zip; then
            echo "Intentando recuperar el ZIP..."
            zip -FF FiwBlockDash-source.zip --out FiwBlockDash-recovered.zip || true
            mv FiwBlockDash-recovered.zip FiwBlockDash-source.zip
          fi
          unzip -t FiwBlockDash-source.zip
          unzip -q FiwBlockDash-source.zip -d source
          find source -maxdepth 5 -type f
      - name: Capture source for diagnosis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path("source").rglob("*.java")) + list(Path("source").rglob("fabric.mod.json")) + list(Path("source").rglob("build.gradle"))
          with open("source/diagnostics.txt", "w") as out:
              for p in files:
                  out.write("\\n===== " + str(p) + " =====\\n")
                  out.write(p.read_text(errors="replace"))
          print("Captured", len(files), "source/config files")
          PY
      - name: Fix integrated-server loading and command permissions
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          candidates = list(Path(".").rglob("FiwBlockDash.java"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected one FiwBlockDash.java, found {candidates}")
          java = candidates[0]
          source = java.read_text()
          permission = ".requires(class_2168::method_43737)"
          removed = source.count(permission)
          source = source.replace(permission, "")
          if "CommandRegistrationCallback.EVENT.register" not in source or 'method_9247("blockdash")' not in source:
              raise SystemExit("BlockDash command registration was not found in source")
          java.write_text(source)
          mod_files = list(Path(".").rglob("fabric.mod.json"))
          if len(mod_files) != 1:
              raise SystemExit(f"Expected one fabric.mod.json, found {mod_files}")
          mod_file = mod_files[0]
          metadata = json.loads(mod_file.read_text())
          metadata["environment"] = "*"
          metadata["version"] = "0.2.0"
          mod_file.write_text(json.dumps(metadata, indent=2) + "\\n")
          # Give this corrected build a distinct filename/version so an old 0.1.9
          # jar cannot silently be mistaken for the new wall fix.
          gradle_props = list(Path(".").rglob("gradle.properties"))
          for props in gradle_props:
              text = props.read_text()
              text, count = re.subn(r"(?m)^mod_version=.*$", "mod_version=0.2.0", text)
              if count:
                  props.write_text(text)
          print("Build version set to 0.2.0")
          print("Removed OP checks:", removed)
          print("Set Fabric environment to '*' so the mod loads in singleplayer clients.")
          PY
      - name: Patch moving walls with physical blocks
        working-directory: source
        run: python3 ../patch_blockdash.py
      - name: Configure intermediary mappings
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          p = Path("build.gradle")
          s = p.read_text()
          old = 'mappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"'
          if old not in s:
              raise SystemExit("Expected intermediary mappings declaration not found")
          p.write_text(s.replace(old, 'mappings files("intermediary-identity.jar")'))
          with zipfile.ZipFile("intermediary-identity.jar", "w") as z:
              z.writestr("mappings/mappings.tiny", "tiny\\t2\\t0\\tintermediary\\tnamed\\n")
          PY
      - name: Build mod
        working-directory: source
        run: |
          set -o pipefail
          gradle clean build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fiw-BlockDash-build-diagnostics
          path: |
            source/build.log
            source/diagnostics.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Fiw-BlockDash-JAR
          path: source/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
