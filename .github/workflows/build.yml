name: Build Fiw BlockDash
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Inspect and extract source
        run: |
          ls -l FiwBlockDash-source.zip
          file FiwBlockDash-source.zip
          if ! unzip -t FiwBlockDash-source.zip; then
            echo "Intentando recuperar el ZIP..."
            zip -FF FiwBlockDash-source.zip --out FiwBlockDash-recovered.zip || true
            mv FiwBlockDash-recovered.zip FiwBlockDash-source.zip
          fi
          unzip -t FiwBlockDash-source.zip
          unzip -q FiwBlockDash-source.zip -d source
          find source -maxdepth 3 -type f
      - name: Build mod
        working-directory: source
        run: gradle clean build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Fiw-BlockDash-JAR
          path: source/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
