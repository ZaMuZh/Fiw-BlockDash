name: Build Fiw BlockDash
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - name: Extract source
        run: |
          unzip -t FiwBlockDash-source.zip
          unzip -q FiwBlockDash-source.zip -d source
          find source -maxdepth 5 -type f
      - name: Capture source for diagnosis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path("source").rglob("*.java")) + list(Path("source").rglob("fabric.mod.json")) + list(Path("source").rglob("build.gradle"))
          with open("source/diagnostics.txt", "w") as out:
              for p in files:
                  out.write("\\n===== " + str(p) + " =====\\n")
                  out.write(p.read_text(errors="replace"))
          print("Captured", len(files), "source/config files")
          PY
      - name: Make commands visible to every player
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = list(Path(".").rglob("FiwBlockDash.java"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected one FiwBlockDash.java, found {candidates}")
          p = candidates[0]
          s = p.read_text()
          permission = ".requires(class_2168::method_43737)"
          count = s.count(permission)
          if count:
              p.write_text(s.replace(permission, ""))
          print("Removed OP restrictions:", count)
          PY
      - name: Configure intermediary mappings
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          p = Path("build.gradle")
          s = p.read_text()
          old = 'mappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"'
          if old not in s:
              raise SystemExit("Expected intermediary mappings declaration not found")
          p.write_text(s.replace(old, 'mappings files("intermediary-identity.jar")'))
          with zipfile.ZipFile("intermediary-identity.jar", "w") as z:
              z.writestr("mappings/mappings.tiny", "tiny\\t2\\t0\\tintermediary\\tnamed\\n")
          PY
      - name: Build mod
        working-directory: source
        run: |
          set -o pipefail
          gradle clean build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fiw-BlockDash-build-diagnostics
          path: |
            source/build.log
            source/diagnostics.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Fiw-BlockDash-JAR
          path: source/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
