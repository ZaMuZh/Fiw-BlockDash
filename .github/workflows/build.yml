name: Build Fiw BlockDash

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract source project
        run: unzip -q FiwBlockDash-source.zip -d source

      - name: Build mod
        working-directory: source/FiwBlockDash-0.1.8
        run: gradle clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Fiw-BlockDash-JAR
          path: source/FiwBlockDash-0.1.8/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
